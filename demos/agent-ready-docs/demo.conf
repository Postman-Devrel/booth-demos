# demo.conf — the only file you edit to retarget this demo.
#
# Every script sources this. Command-line flags always win over what is set here.
# Retargeting the demo to a specific customer means editing keys 1-4.

# ---------------------------------------------------------------------------
# 1. The all-green anchor site shown in Act 2.
#
#    Must be a Fern-powered docs site so the scorecard lands an A on stage.
#    Verified scores (2026-07-30):
#      https://elevenlabs.io/docs   ->  90 / 100  (A)   <- default, marquee customer
#      https://docs.cohere.com      -> 100 / 100  (A)   <- backup, perfect score
#      https://buildwithfern.com/learn -> A            <- Fern's own docs
#
#    Note: elevenlabs.io/docs loses the Contract layer (its openapi.json is
#    401-gated and its api-catalog linkset is empty). That is honest and still
#    an A. Switch to docs.cohere.com if you want every single row green.
FERN_SITE="https://elevenlabs.io/docs"

# ---------------------------------------------------------------------------
# 2. The page used for the HTML-vs-markdown byte diff.
#
#    PIN THIS. Auto-discovery works, but at a booth you want the same number
#    every single time so you can say it out loud before it finishes rendering.
#    Verified: 1,388,460 B of HTML -> 19,606 B of markdown = 98.6% smaller.
AUDIT_PAGE="https://elevenlabs.io/docs/api-reference/text-to-speech/convert"

# ---------------------------------------------------------------------------
# 3. The docs MCP server connected in Act 4.
#
#    MCP_NAME becomes the tool prefix, i.e. mcp__<MCP_NAME>__searchDocs.
#    Fern generates and hosts this for every docs site — nobody hand-built it.
MCP_NAME="elevenlabs-docs"
MCP_URL="https://elevenlabs.io/docs/_mcp/server"

# ---------------------------------------------------------------------------
# 4. The Act 4 question.
#
#    Must be answerable ONLY from the live docs. This one is deliberately a
#    trap: the naive answer is 3 x 200 = 600, but the docs cap non-enterprise
#    burst concurrency at 300. A model that answers 300 demonstrably read the
#    page; a model that answers 600 guessed.
#
#    Ground truth (https://elevenlabs.io/docs/eleven-agents/guides/burst-pricing):
#      - 200-call subscription limit -> 300 maximum concurrent calls (capped)
#      - burst calls are charged at 2x the standard rate
#      - non-enterprise burst concurrency cannot exceed 300
DEMO_QUESTION="Using the elevenlabs-docs MCP server: if my ElevenLabs workspace has a subscription concurrency limit of 200 calls and I turn on burst pricing, what is my maximum number of concurrent calls, what rate are the burst calls charged at, and what is the hard cap for non-enterprise customers? Cite the documentation URL you used."

# The substring setup.sh greps for when it dry-runs the question headlessly.
DEMO_EXPECT="300"

# ---------------------------------------------------------------------------
# 5. Behavior.
TIMEOUT=8        # per-request seconds
BUDGET=15        # hard wall-clock cap for one audit, seconds
MODE=auto        # auto | live | offline

# Pinned so Act 4 behaves the same every run. Comment out to use your default.
CLAUDE_MODEL="claude-sonnet-5"

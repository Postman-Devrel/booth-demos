---
info:
  name: Hourly forecast
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
item:
- name: Forecast
  event:
  - listen: test
    script:
      type: text/javascript
      exec:
      - // Postman test script for the "Hourly forecast" request.
      - "//"
      - "// This is the oracle. It is authored by *you*, not by the agent — that is the"
      - "// whole point. A fixed, external contract is what the client has to satisfy, so"
      - "// the code can actually be wrong and loop."
      - "//"
      - '// It encodes what "correct" means for the client:'
      - "//   1. the request returns 200,"
      - "//   2. the response contains a non-empty hourly.temperature_2m array,"
      - "//   3. those temperatures are reported in Fahrenheit."
      - "//"
      - "// Assertions 1 and 2 are baseline sanity: a reasonable client passes them on the"
      - "// first try (the field really is `temperature_2m`, the response is a full array)."
      - "// Assertion 3 is the one that forces the loop. Nothing in the task says"
      - // "Fahrenheit", and Open-Meteo defaults to Celsius, so a first attempt that looks
      - "// completely correct — 200 and a full array of numbers — still fails assertion 3"
      - "// with a message naming the unit it actually got. That failure is what the loop"
      - "// reads to add `temperature_unit=fahrenheit` and rerun."
      - "//"
      - "// This collection lives in the repo and is run locally by the Postman CLI."
      - "// It is the oracle: the agent must never read it, only see its results."
      - ''
      - pm.test("Status is 200", () => {
      - "  pm.response.to.have.status(200);"
      - "});"
      - ''
      - pm.test("Response includes a non-empty hourly.temperature_2m array", () => {
      - "  const data = pm.response.json();"
      - ''
      - '  pm.expect(data, "no hourly block in response").to.have.property("hourly");'
      - ''
      - "  pm.expect("
      - "    data.hourly,"
      - '    `hourly is missing temperature_2m. Present keys: ${Object.keys(data.hourly).join(", ")}`'
      - '  ).to.have.property("temperature_2m");'
      - ''
      - '  pm.expect(data.hourly.temperature_2m).to.be.an("array").that.is.not.empty;'
      - "});"
      - ''
      - pm.test("Temperatures are reported in Fahrenheit", () => {
      - "  const data = pm.response.json();"
      - "  const unit = data.hourly_units && data.hourly_units.temperature_2m;"
      - ''
      - "  pm.expect("
      - "    unit,"
      - '    `expected temperature_2m in "°F" but got "${unit}" — the request is missing a unit parameter`'
      - '  ).to.equal("°F");'
      - "});"
  request:
    method: GET
    url: "{{forecast_url}}"

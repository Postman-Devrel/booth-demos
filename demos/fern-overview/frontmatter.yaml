product: Fern
name: Fern Overview — One Spec, Your Entire Developer Experience
use_case: Give any audience a 10-minute, product-agnostic tour of Fern — why agents changed who reads your API, and how one OpenAPI spec plus your MDX guides becomes SDKs, a branded developer portal, and agent-ready infrastructure that never drifts.
primary_api:
  - Your own OpenAPI spec (openapi.yaml) + MDX guides — the single source of truth
  - Fern-generated SDKs (Python, TypeScript, Java, Go, C#, Ruby, PHP, Rust)
  - Fern-generated developer portal (guides, API reference, playground, changelog, AI chat)
  - Fern-generated agent surface (llms.txt, llms-full.txt, per-page .md, hosted MCP server)
  - Reference site — ElevenLabs docs (https://elevenlabs.io/docs), built on Fern
key_messages:
  - Agents are the fastest-growing consumer of APIs — 33% of enterprise software will incorporate agentic AI by 2028, up from 1% in 2024
  - Agents interact with APIs four ways — direct REST calls, function calling, MCP, and generated CLIs — and every one of them depends on machine-readable docs and a trustworthy spec
  - There are two gaps today — discovery (HTML docs burn the context window before an agent reaches an endpoint) and reliability (hand-written SDKs drift from the spec)
  - Fern takes one source of truth — OpenAPI plus your MDX guides — and produces two outputs, idiomatic type-safe SDKs and a full branded developer portal
  - The portal is not just an API reference — guides, playground, search, AI chat, changelogs, versioning, auth, analytics, custom domain
  - Agent-readiness is generated, not retrofitted — llms.txt, llms-full.txt, every page as .md, and a hosted MCP server, rebuilt on every docs build so nothing goes stale
  - Type-safe SDKs are agent infrastructure — auth, retries, and pagination belong in the SDK, not in the prompt
  - ElevenLabs runs at 1M SDK downloads/week and 1.5M docs users/month on Fern, with DX using git and Support using the browser editor against the same repo
  - Buy vs build — the gating question is whether bringing your own generator to parity costs less than Fern, and for teams that have run the numbers the answer is no
cta:
  - "See it live: https://buildwithfern.com"
  - "A real Fern portal in production: https://elevenlabs.io/docs"
  - "Open the deck: ./scripts/setup.sh"
demo_length: 10m
presentation_title: One Spec. Your Entire Developer Experience.
brand_style: manual
brand_tokens:
  primary: "#2E9E5B"   # Fern green
  accent: "#FF6C37"    # Postman orange, used sparingly for the parent-brand note
  font: "Inter + IBM Plex Mono"
source: Adapted from the 2026-06-04 "Postman & Fern: Use Cases that Shine" tech talk, with the co-marketing and commercial-detail slides removed so the deck stands alone as a Fern product overview.

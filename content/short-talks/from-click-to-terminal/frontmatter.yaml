format: short-talk
length: 25m (Q&A included)
owner: Anthony Viard <anthony.viard@postman.com>
status: draft
audience: >
  Developers building or supervising coding agents, platform and API-governance
  teams, and anyone who has wondered what a Postman plugin gives an agent that
  the app's UI does not. No Postman account needed for the slides; the live demo
  runs on a throwaway GitHub repo and needs the Postman CLI and Claude Code with
  the Postman plugin.
venues:
  - meetup
  - conference
product: Postman CLI
name: "From Click to Terminal: API Engineering in the Age of Agents"
use_case: >
  A developer has the OpenAPI spec of a new service, transport-service
  (GET and POST /api/rides, GET /api/rides/{ride_id}, GET /health), and asks a
  coding agent to do the API engineering chain from the terminal: `postman
  init`, generate the collection, add tests (the generated collection has no
  assertion), generate a mock and run the tests against it, generate a GitHub
  workflow with the ci-integration skill, push, open a PR and watch the CI.
  Each demo clones a throwaway repo created from the template
  healthcare-org-app/healthcare-transport-template. The workspace is local and
  git-native: nothing is pushed to the Postman cloud (`workspace.id` stays
  empty). The talk ends on one slide of advanced use, a closed, unmerged PR of
  healthcare-appointments (#9) where a platform team's quality gate commented,
  shown without live. The gate is that team's use case built with Postman, not
  a Postman product, and the subject of another talk.
primary_api:
  - "The Postman Claude Code plugin and `postman init`: the two paths a Postman skill takes to reach an agent"
  - "Postman CLI (1.85.0 in the rehearsal), one command per step: postman init --json -y, postman spec generate collection, postman collection request update, postman mock generate, postman collection run --use-mock"
  - "The ci-integration skill, which writes .github/workflows/api-checks.yml (contract lint with --issueType=syntax, collection lint, run against the mock, AI readiness)"
  - "The template repo: https://github.com/healthcare-org-app/healthcare-transport-template (transport-service, openapi.yaml only)"
  - "Advanced use, shown without live: https://github.com/healthcare-org-app/healthcare-appointments/pull/9 (a platform team's quality gate, gate v0.6.3)"
  - "Postman CLI: https://www.postman.com/product/postman-cli/"
key_messages:
  - A coding agent doesn't need Postman's UI. It needs a command per step of the API engineering chain, and the Postman CLI is that.
  - An agent's Postman know-how lives in committed skills, not in a chat. The plugin puts them in a developer's own Claude Code; `postman init` commits the same skills into the repo.
  - Generating is not testing. The collection generated from the spec has no assertion; adding the tests, running them against a mock and wiring them in CI is the agent's work, one command per step.
  - The whole chain stays in files and in git, from spec to green PR, with a local workspace and no cloud push. In the rehearsal the CI run took 19 s and needed no secret.
  - It has a cost. The skills are files to keep current (the bootstrap skill cites an option the CLI refuses), the generated workflow tests the mock and not the running service, and a secret that is needed later stays in CI, out of the agent's sight.
  - A platform team can build much more on the same blocks, such as a quality gate that comments on every PR. That is its own use case, built with Postman, not a Postman product, and the subject of another talk.
cta:
  - "npx @postman/postman-plugin, then ask your agent to work an API change"
  - "Postman CLI: https://www.postman.com/product/postman-cli/"
  - "Postman Liftoff: https://www.postman.com/liftoff/"
  - "Join the Postman community on Discord: https://postman-community.com/kmg"
  - "Advanced use, a platform team's gate on a PR: https://github.com/healthcare-org-app/healthcare-appointments/pull/9"

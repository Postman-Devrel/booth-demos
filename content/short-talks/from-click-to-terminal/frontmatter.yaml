notes: >
  THE DECK OF RECORD IS `presentation/index.html`, 15 slides, in the Postman
  dark look. It started from the Claude Design deck "From Click to Terminal"
  (`presentation_url`, kept as the origin), but it has diverged: slides 01 to
  11 are still that deck's (one mock command changed on slide 11), slides 12
  (the demo chain), 13 (what it costs) and 14 (advanced use, PR #9) were
  written here, and slide 15 (Try it) has new links. Do not re-export the
  Claude Design deck over it: you would lose slides 12 to 15. The live demo
  starts at slide 12.

  THE OLD DEMO IS GONE FROM THIS TALK. The healthcare quality gate (rename of
  `mrn`, the gate loop, the 32 consumers, the Context Graph step) is no longer
  demoed. All of that material is kept, verbatim, in `gate-talk-material.md`
  for a future talk. That file also records that its sentence "required on
  appointments-service" is false: the gate is not a required check on `main` of
  healthcare-appointments (the branch is not protected).

  THE GATE IS NOT A POSTMAN PRODUCT. It is a use case a platform team built
  with Postman. Say so on slide 14 and don't present it as something Postman
  ships. The four lines quoted on slide 14 are the real ones of PR #9 (gate
  v0.6.3).

  THE DEMO RUNS ON A THROWAWAY REPO. `setup.sh` creates a repo
  `healthcare-transport-<suffix>` from the template
  `healthcare-org-app/healthcare-transport-template`, clones it to /tmp and
  creates a demo branch. `teardown.sh` closes the PR, deletes the repo and
  deletes the clone. The scripts are written separately from this README:
  check that what the README says matches what they do.

  LOCAL WORKSPACE, NO CLOUD PUSH. `workspace.id` stays empty in
  `.postman/resources.yaml`. Say so when the file is on screen.

  REHEARSAL FACTS (one rehearsal, CLI 1.85.0, plugin postman 2.0.1, commands
  played one by one by Claude, see the README): init 7.8 s, collection 4.3 s,
  mock 4.1 s, run 5 s (4 requests, 4 assertions), CI run green in 19 s
  (https://github.com/healthcare-org-app/healthcare-transport-rehearsal-1/pull/1).
  Not measured: an agent doing the whole chain from one prompt (variability,
  total time), and a red CI run.

  KNOWN TRAPS: `postman init --json -y` is the working command; the bootstrap
  skill cites `--no-cloud`, which CLI 1.85.0 refuses. `postman init` creates
  `.opencode/`. `spec lint` without a login fails, hence `--issueType=syntax`
  in CI. The `junit` reporter is refused for v3 collections.

  THE INSTALL PATH IS NOT DECIDED. The CTA keeps `npx @postman/postman-plugin`;
  the canonical path (that or `claude plugin install ...`) is still to align
  with the plugin team.

  THE 10-MINUTE BOOTH CUT (`content/lightning-talks/from-click-to-terminal/`)
  is written for an older demo and is being redone separately.

  SAME PRODUCT AS open-meteo-loop-eng, DIFFERENT SIGNAL AND DIFFERENT SCOPE.
  That talk is the CLI as a test oracle for one API. This one is the CLI and
  committed skills as an agent's toolbox over a whole chain, from spec to PR.
  If a booth crowd has seen both, lead with that distinction.

format: short-talk
length: 27m (Q&A included)
owner: Anthony Viard <anthony.viard@postman.com>
status: draft
audience: >
  Developers and platform/API engineers who supervise coding agents, and anyone who has
  watched a build stay green while an API broke anyway. No Postman account needed for the
  slides. The live demo needs a Postman CLI login whose team has `appointments-service` in
  the API Context Graph (the Postman DevRel team's already does), and push access to the
  product repo.
venues:
  - meetup
  - conference
product: Postman CLI
name: "Let the Gate Decide"
use_case: >
  Show that a code-quality tool never looks at the API contract or at who depends on it — a
  coding agent can rename a response field, update its own unit tests to match, keep the
  build green, and still break every consumer. Then show the fix live: a naive coding agent
  "cleans up" an endpoint exactly the way a product owner might ask for, a five-step
  deterministic quality gate catches it in CI with two hard blockers, a second, read-only
  agent reads the verdict and briefs the first one, and the same agent fixes it and pushes
  until the gate is green — the whole loop running on Postman CLI commands anyone could type,
  in a gate the agent cannot see, skip, or edit.
primary_api:
  - "The product repo: https://github.com/Postman-Devrel/agent-quality-gate (branch main) — contract/openapi.yaml, the Spring Boot 3 / Java 21 appointments API, and gate/"
  - "The five gate steps, each one a Postman CLI command: postman skills status --json, postman spec lint, postman collection run --use-mock, postman spec ai-readiness, postman context-graph ask"
  - "API Context Graph: https://www.postman.com/context-graph/ — who consumes appointments-service (today: patients-service)"
  - ".claude/agents/api-coder and .claude/agents/gate-reviewer in the product repo; the demo adds a third, demo-only api-coder-naive"
key_messages:
  - A green build proves nothing about the API contract or about who depends on it — a renamed field with its own test updated to match is a green build and a broken consumer.
  - API-first means the contract comes before the code: the Postman collection, mock, and spec are versioned derivatives of it, not a separate truth someone updates by hand.
  - The gate is five deterministic Postman CLI steps run in CI, independent of the agent that wrote the change — it cannot skip the gate, edit it to its advantage, or see the secret the gate runs with.
  - A score alone would not have stopped this change; two hard blockers did, on top of the score.
  - The reviewer agent is read-only — it finds the exact commit's CI run, reads the machine-readable report, and writes a brief the coding agent can act on without a human relaying it.
  - Honesty about gaps is part of the design, not a cover-up — a step that cannot run today is shown in grey, excluded from the score, and never counted as a pass.
cta:
  - "Postman CLI: https://www.postman.com/product/postman-cli/"
  - "API Context Graph: https://www.postman.com/context-graph/"
  - "Clone the product repo and run the gate yourself: git clone https://github.com/Postman-Devrel/agent-quality-gate.git && ./gate/run-all.sh"
  - "This talk's slides and setup tooling: git clone https://github.com/Postman-Devrel/booth-demos.git -> cd booth-demos/content/short-talks/agent-quality-gate"
presentation_title: "Let the Gate Decide"
brand_style: manual
notes: >
  TITLE IS A SUGGESTION, NOT FIXED. "Let the Gate Decide" was picked to name the thesis (a
  deterministic, independent gate — not the agent, not a human relaying a verdict — makes the
  pass/fail call); rename it freely if a better one lands during rehearsal, just update
  frontmatter.yaml, README.md and presentation/index.html together.

  THIS FOLDER CARRIES SLIDES, TALK TRACK, AND SETUP/TEARDOWN ONLY. The live demo runs inside
  the product repo, github.com/Postman-Devrel/agent-quality-gate, the same pattern
  content/short-talks/postman-in-the-terminal/ uses for its own external demo repo. No
  product code lives here.

  THE BRIEF THIS TALK IS BUILT FROM IS A SEPARATE, LARGER DELIVERABLE, NOT DUPLICATED HERE.
  BRIEF.md (in a local `agent-quality-gate-demo-material` folder, not part of this repo) asks
  for a whole demo-material repo: README, prompts/, agents/api-coder-naive.md,
  scripts/preflight.sh, scripts/reset.sh, scripts/seed-failure.sh, docs/, and a rehearsal log.
  None of that exists in the product repo yet as far as this talk's author could verify. This
  short talk assumes it gets built (see README section 2) and documents the story on top of
  it; it is not a substitute for that work.

  OPTION A (naive-coder variant) IS THE DESIGN THIS TALK COMMITS TO, PER THE BRIEF. The brief
  tried the real, careful api-coder first and it passed the gate on the first try (rating A,
  94) — a demo whose gate never fails shows nothing. Option A ships a demo-only
  api-coder-naive agent definition, identical to api-coder but without its "hard rules"
  against renaming fields, making request fields required, or editing the gate — it mirrors a
  real coding agent that does not know about consumers or lint rules. Option B (apply a
  prepared patch instead of a live failure) is the brief's deterministic fallback if the live
  agent does not fail the gate on rehearsal; narrate it openly as prepared if it is used.

  EVERY RATING/SCORE NUMBER BELOW CAME FROM THE BRIEF'S OWN SCENARIO FILES
  (scenarios/01-safe-change.md, 02-agent-breaking-change.md), NOT FROM A REHEARSAL THIS TALK
  RAN. Treat them as the documented, expected outcome of the design, not as "verified live."
  Section 4.9 of the brief calls for an end-to-end rehearsal log with real timings and real
  ratings; that log does not exist yet. Do not present a number from this README as something
  you personally watched happen until a rehearsal confirms it — say "expected" out loud if
  asked, and update this file with the real numbers the first time it runs end to end.

openapi: 3.1.0

info:
  title: prescriptions-service
  version: 1.0.0
  summary: "Prescription records for the healthcare-org pharmacy domain."
  description: |
    HTTP API for `prescriptions-service` (domain: **pharmacy**, port **8501**).

    Records are stored as a fixed envelope (`id`, `status`, `created_at`,
    `updated_at`) around a free-form JSONB `data` document. Responses flatten the
    two: envelope fields sit alongside the caller-supplied `data` keys at the top
    level of the object. That is why `Prescription` allows additional properties.

    ### Side effects
    Every mutating endpoint publishes a Kafka domain event, and *every* endpoint
    (reads included) publishes an `audit.event`. The events are listed per
    operation below.

    ### Peer enrichment on create
    `POST /api/prescriptions/` calls out to peer services to snapshot related
    records. Each lookup is best-effort: on failure the response carries a
    `*_warn` string instead of a `*_snapshot` object.

    | Request field   | Peer service              | Adds on success        | Adds on failure     |
    |-----------------|---------------------------|------------------------|---------------------|
    | `patient_id`    | `patients-service`        | `patient_snapshot`     | `patient_warn`      |
    | `prescriber_id` | `providers-service`       | `prescriber_snapshot`  | `prescriber_warn`   |
    | `drug`          | `drug-interactions-service` | `interactions_snapshot` | `interactions_warn` |

servers:
  - url: https://myhealthcare.dev
    description: Production
    x-fern-server-name: Production
  - url: http://localhost:8501
    description: Local development (host)
    x-fern-server-name: Local
  - url: http://prescriptions-service:8501
    description: Docker compose, on the `healthcare_net` network
    x-fern-server-name: Docker

security:
  - bearerAuth: []

tags:
  - name: Prescriptions
    description: CRUD and refill operations over prescription records.
  - name: Health
    description: Unauthenticated liveness and readiness probes.

paths:
  /api/prescriptions/:
    get:
      operationId: listPrescriptions
      summary: List prescriptions
      description: |
        Returns a page of prescriptions plus the total count matching the filter.

        **Ad-hoc filtering.** Any query parameter other than `limit`, `offset` and
        `status` is treated as a JSON field filter and compiled to
        `data->>'<key>' = '<value>'`. Multiple filters are ANDed. Because the set
        of keys is open-ended it cannot be enumerated here — see
        `additionalFilters` below for how the generated SDK exposes it.

        Publishes: `audit.event` (`prescriptions.list`).
      tags: [Prescriptions]
      x-fern-sdk-group-name: prescriptions
      x-fern-sdk-method-name: list
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          required: false
          description: |
            Page size. Defaults to 50. Values above 500 are silently clamped to
            500 rather than rejected.
          schema:
            type: integer
            format: int32
            default: 50
          example: 25
        - name: offset
          in: query
          required: false
          description: Number of rows to skip, applied after ordering by `id` ascending.
          schema:
            type: integer
            format: int32
            default: 0
          example: 0
        - name: status
          in: query
          required: false
          description: |
            Exact match on the envelope `status` column (not on `data`).
            Deactivated records have status `inactive`.
          schema:
            type: string
          example: active
      responses:
        '200':
          description: A page of prescriptions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createPrescription
      summary: Issue a prescription
      description: |
        Creates a prescription. The request body is stored verbatim as the record's
        `data` document, except for `id`, which is stripped if present.

        Before insert, the service enriches the payload with snapshots from
        `patients-service`, `providers-service` and `drug-interactions-service`
        (see the peer-enrichment table in the API description). Those snapshots are
        persisted into `data`, so they appear on every subsequent read of the record.

        Publishes: `prescription.issued`, `audit.event` (`prescriptions.create`).
      tags: [Prescriptions]
      x-fern-sdk-group-name: prescriptions
      x-fern-sdk-method-name: create
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        description: |
          Optional. A missing or unparseable body is treated as `{}` and creates an
          empty record rather than failing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
      responses:
        '201':
          description: The created prescription, including any peer snapshots.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/prescriptions/{record_id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/RequestId'

    get:
      operationId: getPrescription
      summary: Get a prescription
      description: |
        Fetches a single prescription by id. Deactivated records are still
        returned, with `status: inactive`.

        Publishes: `audit.event` (`prescriptions.read`).
      tags: [Prescriptions]
      x-fern-sdk-group-name: prescriptions
      x-fern-sdk-method-name: get
      responses:
        '200':
          description: The prescription.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updatePrescription
      summary: Update a prescription
      description: |
        Shallow-merges the request body into the record's existing `data` document:
        keys present in the body overwrite, keys absent are preserved. Nested
        objects are replaced wholesale, not merged recursively.

        `status` is lifted out of the body and written to the envelope column.
        `id` is stripped and ignored.

        Publishes: `audit.event` (`prescriptions.update`). No domain event —
        `UPDATED_EVENT` is unset for this service.
      tags: [Prescriptions]
      x-fern-sdk-group-name: prescriptions
      x-fern-sdk-method-name: update
      requestBody:
        required: false
        description: Fields to merge. A missing or unparseable body is treated as `{}`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionUpdateRequest'
      responses:
        '200':
          description: The updated prescription.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: replacePrescription
      # Handled by the exact same Flask view as PATCH — it merges, it does not
      # replace. Documented for completeness, but excluded from SDK generation so
      # Fern emits one `update` method instead of two identical ones. Drop this
      # extension if you want both surfaced.
      x-fern-ignore: true
      summary: Update a prescription (PUT alias)
      description: |
        Identical to `PATCH /api/prescriptions/{record_id}` — the same handler is
        bound to both verbs, so this performs a **shallow merge**, not a
        replacement. Prefer `PATCH`.
      tags: [Prescriptions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionUpdateRequest'
      responses:
        '200':
          description: The updated prescription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deactivatePrescription
      summary: Deactivate a prescription
      description: |
        Soft delete. Sets `status` to `inactive` and bumps `updated_at`; the row and
        its `data` document are retained and remain readable via
        `GET /api/prescriptions/{record_id}`.

        Not idempotent in effect but safe to repeat — a second call on an already
        inactive record still returns `200`.

        Publishes: `audit.event` (`prescriptions.deactivate`).
      tags: [Prescriptions]
      x-fern-sdk-group-name: prescriptions
      x-fern-sdk-method-name: deactivate
      responses:
        '200':
          description: Acknowledgement carrying the deactivated record id.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/prescriptions/{record_id}/refill:
    post:
      operationId: requestPrescriptionRefill
      summary: Request a refill
      description: |
        Requests a refill for an existing prescription.

        The endpoint only verifies that the record exists — it does not check
        `status`, remaining refills, or expiry, and it does not mutate the record.
        Fulfilment is handled asynchronously by whichever service consumes the
        event.

        Publishes: `prescription.refill_requested`, `audit.event`
        (`prescription.refill_request`).
      tags: [Prescriptions]
      x-fern-sdk-group-name: prescriptions
      x-fern-sdk-method-name: requestRefill
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The refill request was accepted and published to the event bus.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefillResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No prescription with that id. Note this endpoint returns the terse
            body `{"error": "not found"}` rather than the resource-qualified
            message used by the CRUD endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not found

  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Always returns `200` if the process is up. Performs no dependency checks.
      tags: [Health]
      security: []
      x-fern-sdk-group-name: health
      x-fern-sdk-method-name: check
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Checks the Postgres connection with `SELECT 1`. Kafka is not probed — the
        producer is created lazily — so a green `/ready` does not imply a reachable
        broker.
      tags: [Health]
      security: []
      x-fern-sdk-group-name: health
      x-fern-sdk-method-name: ready
      responses:
        '200':
          description: All probed dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: ok
                service: prescriptions-service
                problems: []
        '503':
          description: At least one dependency check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                status: degraded
                service: prescriptions-service
                problems:
                  - 'db: connection refused'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT issued by `auth-service`, sent as `Authorization: Bearer <token>`.
        The token must carry `sub` and `exp` claims and a `scopes` array.

        Required scopes, enforced per operation:

        - `prescriptions.read` — `GET` on the collection and on a single record
        - `prescriptions.write` — `POST`, `PUT`, `PATCH`, `DELETE`, and refill

        A token with `scopes: ["*"]` satisfies any requirement. Scopes are not
        modelled as OpenAPI scopes because this is an HTTP bearer scheme, not
        OAuth 2 — there is no token endpoint on `auth-service`.

        Setting `AUTH_DISABLED=1` on the service bypasses verification entirely
        and injects a `dev-user` principal. That is a local-development switch;
        the shipped `.env.example` enables it.

  parameters:
    RecordId:
      name: record_id
      in: path
      required: true
      description: Primary key of the prescription record.
      schema:
        type: integer
        format: int64
      example: 1042

    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Correlation id propagated across HTTP hops and onto published Kafka
        events. Generated by the service if omitted, and echoed on every response.
      schema:
        type: string
      example: 9f1c2b7a4e8d4c1fa0b3e6d5c4a29187

  headers:
    XRequestId:
      description: The correlation id for this request, echoed back.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request — for the list endpoint, a non-integer `limit` or `offset`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: offset/limit must be integers

    Unauthorized:
      description: The bearer token is missing, malformed, expired, or fails signature verification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: No Authorization header
              value:
                error: missing bearer token
            invalid:
              summary: Token rejected
              value:
                error: invalid token

    Forbidden:
      description: The token is valid but lacks the scope this operation requires.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScopeError'
          example:
            error: insufficient scope
            required:
              - prescriptions.write
            have:
              - prescriptions.read

    NotFound:
      description: No prescription exists with the given id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: prescriptions 999999 not found

  schemas:
    Prescription:
      type: object
      description: |
        A prescription record. The four envelope fields are always present and
        server-managed; everything else is the caller's `data` document, flattened
        to the top level. Additional properties are therefore expected, not an error.
      required:
        - id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Server-assigned primary key.
        status:
          type: string
          description: |
            Lifecycle state. `active` on create; `inactive` after `DELETE`. Any
            other string may be set through the `status` field on update.
          default: active
          example: active
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        patient_id:
          type: integer
          format: int64
          description: Foreign key into `patients-service`.
        prescriber_id:
          type: integer
          format: int64
          description: Foreign key into `providers-service`.
        drug:
          type: string
          description: Drug identifier passed to `drug-interactions-service`.
        patient_snapshot:
          type: object
          additionalProperties: true
          description: Patient record captured from `patients-service` at issue time.
        prescriber_snapshot:
          type: object
          additionalProperties: true
          description: Provider record captured from `providers-service` at issue time.
        interactions_snapshot:
          type: object
          additionalProperties: true
          description: Interaction check captured from `drug-interactions-service` at issue time.
        patient_warn:
          type: string
          description: Present instead of `patient_snapshot` when the patient lookup failed.
        prescriber_warn:
          type: string
          description: Present instead of `prescriber_snapshot` when the provider lookup failed.
        interactions_warn:
          type: string
          description: Present instead of `interactions_snapshot` when the interaction lookup failed.
      additionalProperties: true
      example:
        id: 1042
        status: active
        created_at: '2026-08-12T09:14:22.481930+00:00'
        updated_at: '2026-08-12T09:14:22.481930+00:00'
        patient_id: 77
        prescriber_id: 12
        drug: amoxicillin
        dosage: 500mg
        frequency: TID
        refills_remaining: 2

    PrescriptionCreateRequest:
      type: object
      description: |
        Free-form prescription payload. The listed properties are the ones the
        service acts on; any other key is stored as-is on the record. An `id` key
        is discarded.
      properties:
        patient_id:
          type: integer
          format: int64
          description: Triggers a snapshot lookup against `patients-service`.
        prescriber_id:
          type: integer
          format: int64
          description: Triggers a snapshot lookup against `providers-service`.
        drug:
          type: string
          description: Triggers an interaction lookup against `drug-interactions-service`.
      additionalProperties: true
      example:
        patient_id: 77
        prescriber_id: 12
        drug: amoxicillin
        dosage: 500mg
        frequency: TID
        refills_remaining: 2

    PrescriptionUpdateRequest:
      type: object
      description: |
        Fields to shallow-merge into the record's `data`. `status` is special-cased
        onto the envelope column; `id` is discarded.
      properties:
        status:
          type: string
          description: New envelope status. Omit to leave unchanged.
          example: on_hold
        patient_id:
          type: integer
          format: int64
        prescriber_id:
          type: integer
          format: int64
        drug:
          type: string
      additionalProperties: true
      example:
        refills_remaining: 1
        notes: Patient reports mild nausea.

    PrescriptionPage:
      type: object
      required:
        - count
        - items
      properties:
        count:
          type: integer
          format: int64
          description: |
            Total rows matching the filter, ignoring `limit` and `offset` — use it
            to drive pagination, not `items.length`.
        items:
          type: array
          description: The requested page, ordered by `id` ascending.
          items:
            $ref: '#/components/schemas/Prescription'
      additionalProperties: false

    DeactivateResponse:
      type: object
      required:
        - deactivated
      properties:
        deactivated:
          type: integer
          format: int64
          description: Id of the record that was set to `inactive`.
      additionalProperties: false
      example:
        deactivated: 1042

    RefillResponse:
      type: object
      required:
        - prescription_id
        - refill_requested
      properties:
        prescription_id:
          type: integer
          format: int64
        refill_requested:
          type: boolean
          description: Always `true`; the request was published to the event bus.
          const: true
      additionalProperties: false
      example:
        prescription_id: 1042
        refill_requested: true

    HealthStatus:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: prescriptions-service
      additionalProperties: false

    ReadinessStatus:
      type: object
      required:
        - status
        - service
        - problems
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: prescriptions-service
        problems:
          type: array
          description: One entry per failed dependency check. Empty when `status` is `ok`.
          items:
            type: string
      additionalProperties: false

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable failure message.
      additionalProperties: false

    ScopeError:
      type: object
      description: Returned on `403` — carries the scope gap alongside the message.
      required:
        - error
        - required
        - have
      properties:
        error:
          type: string
          const: insufficient scope
        required:
          type: array
          description: Scopes the operation demands.
          items:
            type: string
        have:
          type: array
          description: Scopes present on the presented token, sorted.
          items:
            type: string
      additionalProperties: false

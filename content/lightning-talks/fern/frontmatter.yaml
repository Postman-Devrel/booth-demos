name: Fern — Docs, SDKs, and a CLI for your API
use_case: Give any audience a 10-minute, slide-driven overview of Fern — how one API spec becomes a branded docs site, idiomatic SDKs in every language, and a CLI, all built for developers and agents in the AI era.
primary_api:
  - Your own OpenAPI / GraphQL / AsyncAPI / gRPC spec — the single source of truth
  - Fern-generated SDKs (one spec, every language)
  - Fern-generated docs portal (developers + agents: llms.txt, per-page markdown, MCP)
  - Fern-generated CLI (branded, idiomatic, from the same spec)
  - Provided deck — presentation/index.html (a self-contained scroll deck, no live coding)
key_messages:
  - One source of truth — a push to your spec regenerates the docs, the SDKs, and the CLI, so nothing drifts
  - Docs are built for developers AND agents — stunning by default for people, machine-readable by default for LLMs
  - SDKs are designed by language experts — one spec, every language, the same ergonomic type system, networking, reliability, and auth in each
  - A branded CLI falls out of the same spec — every endpoint becomes a command, for agents and developers alike
  - The results are measured, not promised — Frame.io cut time-to-first-API-call from 1-14 days to under an hour (99%); Unleash's Ask Fern resolves 91.5% of questions without a human
  - Fern runs at scale — 8,000+ teams, 1M+ SDK downloads/week, 1.5M docs users/month
  - Enterprise-ready by default — SAML/OIDC, role-based access, and a migration team that handles the heavy lifting off ReadMe, Mintlify, or an internal stack

format: lightning-talk
length: 10m
owner: Anthony Viard <anthony.viard@postman.com>
status: draft
audience: >
  Developers building or supervising coding agents, and anyone who has wondered
  what a Postman plugin actually gives an agent that the app's UI does not. No
  Postman account needed for the slides; the live demo needs a Postman account
  whose team has Context Graph enabled (the Postman DevRel team's already does,
  with github.com/healthcare-org-app ingested, swap in your own API if you
  present under a different account).
venues:
  - booth
  - meetup
product: Postman CLI
name: "Postman in the terminal"
use_case: >
  The 10-minute booth cut of the short talk by the same name: a coding agent's
  Postman know-how comes from committed skills, not a chat window. The live
  part shows one agent, nobody is prompting it, reviewing a real pull request
  and asking the Context Graph who depends on the endpoint it changed.
key_messages:
  - A coding agent's Postman know-how comes from committed skills, not from something it was told once in a chat.
  - Those skills arrive two ways: the plugin installs them in a developer's own agent, and `postman init` commits them into the repo, so an agent running in CI gets the same skills with nobody there to prompt it.
  - The CI agent reports. It never blocks a merge, and the demo is honest about that limit.
cta:
  - "npx @postman/postman-plugin, then ask your agent to review your next API change"
  - "Postman CLI: https://www.postman.com/product/postman-cli/"
  - "API Context Graph: https://www.postman.com/context-graph/"
  - "Grab the full 25-minute version: git clone https://github.com/Postman-Devrel/booth-demos.git (content/short-talks/postman-in-the-terminal)"
  - "Join the Postman community on Discord: https://postman-community.com/kmg"

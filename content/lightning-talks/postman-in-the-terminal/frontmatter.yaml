  - "The demo repos: https://github.com/healthcare-org-app/healthcare-patients and https://github.com/healthcare-org-app/healthcare-api-quality-gate"
  - "Grab the full version: git clone https://github.com/Postman-Devrel/booth-demos.git (content/short-talks/postman-in-the-terminal)"
  - "Join the Postman community on Discord: https://postman-community.com/kmg"

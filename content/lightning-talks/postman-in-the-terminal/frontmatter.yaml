  the plugin layer. Slide 17 re-opens the same pyramid for the close, so the
  deck never needs a slide 16 recap in this cut.

  WHAT'S CUT, FULL STOP: acts 6 ("what it costs") and 7 ("objections") have
  no slide and no spoken line in this cut — if a booth attendee asks either
  question, answer it one-to-one after the run, the lightning format has no

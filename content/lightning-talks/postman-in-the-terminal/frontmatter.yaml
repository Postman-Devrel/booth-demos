notes: >
  THIS CUT USES ONLY THE booth-MARKED SLIDES from the short talk's deck. Every
  slide reference below is `[slide ?]` because the deck's slide-by-slide
  outline was not available when this README was written — re-map against
  the real deck before presenting, and never invent a slide title in the
  meantime.

  WHAT'S SPOKEN INSTEAD OF SHOWN: the short talk's act 2 ("why it happens")
  and act 3 ("the idea") are folded into one spoken bridge line here instead
  of their own slides; acts 6 ("what it costs") and 7 ("objections") are cut
  entirely — if a booth attendee asks either question, answer it one-to-one
  after the run, the lightning format has no Q&A slot inside the 10 minutes.

  THE LIVE DEMO ITSELF IS NOT RE-DESCRIBED HERE. It is exactly the short
  talk's acts 4 and 5 (the real repo, removing `blood_type` by hand, opening

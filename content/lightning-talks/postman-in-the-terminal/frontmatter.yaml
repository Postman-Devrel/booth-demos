format: lightning-talk
length: 10m
owner: Anthony Viard <anthony.viard@postman.com>
status: draft
audience: >
  Developers building or supervising coding agents, platform and API-governance
  teams, and anyone who has wondered what a Postman plugin gives an agent that
  the app's UI does not. No Postman account needed for the slides; the live demo
  needs a Postman account whose team has the Context Graph for
  github.com/healthcare-org-app ingested (the Postman DevRel team's does).
venues:
  - booth
  - meetup
product: Postman CLI
name: "Postman in the terminal"
use_case: >
  The 10-minute booth cut of the short talk by the same name. A platform team
  (the fictional healthcare-org-app) built an API quality gate with Postman
  building blocks, and every service calls it from its own CI. The live part
  runs on healthcare-org-app/healthcare-patients: a hand-made rename of `mrn`
  to `medical_record_number` opens a PR, the gate fails it (rating D in the CI
  rehearsal, contract-tests and impact blocking, 32 consumers), and the
  presenter's own Claude Code session runs the gate loop with the read-only
  gate-verdict reviewer until the gate is green or the loop stops with
  NEEDS_DECISION. Nothing is merged. The gate is the healthcare org's use case
  built with Postman, not a Postman product.
key_messages:
  - A change that looks harmless locally can still fail a quality gate. Here a rename in the response contract fails contract tests and hits 32 consumers.
  - The developer's own Claude Code session fixes it through the gate loop, without a human relaying the report. The rules live in files (the platform team's gate plugin, a short CLAUDE.md), not in the prompt.
  - Two honest endings, green or NEEDS_DECISION (a human decides). The session never merges and cannot edit the gate.
  - The quality gate is a use case a platform team built with Postman. It is not something Postman ships.
cta:
  - "npx @postman/postman-plugin, then ask your agent to work an API change"

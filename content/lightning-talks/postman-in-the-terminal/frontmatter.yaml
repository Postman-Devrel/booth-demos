  idea") are not cut, just compressed onto the three pyramid-layer slides
  above (5, 8, 13) instead of their own separate slides.

  THE LIVE DEMO ITSELF IS NOT RE-DESCRIBED HERE. It is exactly the short
  talk's acts 4 and 5 (the real repo, removing `blood_type` by hand, opening

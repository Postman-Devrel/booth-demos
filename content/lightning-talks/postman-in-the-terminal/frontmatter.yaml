notes: >
  THIS CUT IS 6 OF THE DECK'S 18 SLIDES: 1 (Title), 2 (Pyramid), 14
  (postman init), 15 (Live demo), 17 (What to take away), 18 (Try it). The deck
  of record is the short talk's `presentation/index.html`; this folder has no
  deck of its own. Durations are estimates pending rehearsal (~9:30 planned).

  THE LIVE DEMO IS NOT RE-DESCRIBED HERE. It is the short talk's act 4b (the
  by-hand rename and the PR) and act 5 (the gate comment, then the gate loop),
  run with the same scripts. Cut: the workspace tour (4a), the gate repo tour
  (6a), the Context Graph UI (6b), and acts 2, 7 and 8. Questions on those go
  one-to-one after the run.

  THE GATE LOOP MAY NOT FINISH IN THE SLOT. A CI round is about 80 s plus the
  agent's work. Time it in rehearsal; if it is still running when act 3 ends,
  say so and read the latest verdict, never fake a result. Two honest endings:
  green or NEEDS_DECISION. The demo PR is never merged.

  CI REHEARSAL OF 2026-10-29 (gate 0.5.0, PR #2, closed, not merged): rating D
  (60/100), FAILED, blockers contract-tests (3/10) and impact (32 consumers).
  Read the real comment on the day. Since gate 0.6.2 the comment opens with the quality change against main;
  the numbers in the short talk are not measured on this demo.

  The gate plugin must be installed at user level and the old
  postman-agent-quality-gate plugin disabled: see the short talk's README.

name: API change review

on:
  pull_request:
    paths: ["openapi.yaml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Postman CLI and Claude Code
        run: |
          npm install -g postman-cli@latest
          npm install -g @anthropic-ai/claude-code

      - name: Log in to Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Fetch the base branch for the diff
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Check whether the repo's skills are current
        continue-on-error: true
        run: postman skills status

      - name: Run the agent with the repo's Postman skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT="$(cat agents/api-change-reviewer.md)

          This is PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
          The base branch is origin/${{ github.event.pull_request.base.ref }}. Diff against it."

          set -o pipefail
          claude -p "$PROMPT" \
            --dangerously-skip-permissions \
            --allowedTools "Bash" \
            --verbose \
            --output-format stream-json \
          | tee claude-run.jsonl \
          | jq -r '
              if .type == "assistant" then
                (.message.content[]? | select(.type == "tool_use" and .name == "Bash") | "$ " + .input.command)
              elif .type == "result" then
                "\n--- result ---\n" + .result
              else empty end
            '
          exit "${PIPESTATUS[0]}"

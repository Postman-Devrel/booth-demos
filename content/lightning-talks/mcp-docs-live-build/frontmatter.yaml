format: lightning-talk
length: 10m
owner: Anthony Viard <anthony.viard@postman.com>
status: draft
audience: >
  Booth traffic — developers and API/platform folks who already ship docs and are being
  asked why agents cannot use them. No prior Fern or MCP knowledge assumed. Someone may
  join mid-run, so every act has to make sense from where it starts.
venues:
  - booth
  - meetup
product: Fern (docs site, per-page Markdown, llms.txt, and an MCP server generated from one OpenAPI spec)
name: Make MCPs Your Documentation Best Friend — Live Build
use_case: >
  Build the whole agent-facing docs surface from nothing, on stage, in ten minutes: one
  OpenAPI file in an otherwise empty folder, then fern init, two small YAML files, and
  fern generate --docs — and finish by connecting the site's own MCP server to a local
  Claude Code session and asking it a question about the API that no model can guess the
  answer to.
primary_api:
  - appointments-service — openapi/appointments.openapi.yaml (10 operations, domain appointments, port 8600)
  - "The spec is copied to $WORKDIR (default /tmp/appointments-docs) by scripts/setup.sh — the demo never touches this repo"
  - "The Fern organization: postman-devrel — permanent, shared with the DevRel team, NOT the subdomain"
  - "The site the demo publishes: https://$FERN_HANDLE.docs.buildwithfern.com (default booth-demo), inside that org"
  - "Its MCP server: https://$FERN_HANDLE.docs.buildwithfern.com/_mcp/server (one tool: searchDocs)"
  - "The REAL MyHealthcare documentation, used read-only as the warm fallback and NEVER a publish target: https://myhealthcare.docs.buildwithfern.com"
key_messages:
  - Your docs have two readers now — a developer who skims, and an agent that has to discover, authenticate, parse, and recover from errors on its own
  - The agent-facing surface is three things — an llms.txt index, per-page Markdown, and an MCP server — and none of them existed as a requirement when your portal was built
  - You do not write those three by hand; maintaining four artifacts by hand means four owners and four chances to drift
  - One OpenAPI spec plus five lines of docs.yml produces all four outputs together, which is the only way they stay in sync
  - The proof is a fact the agent could not have guessed — a plain PATCH on an appointment emits appointment.cancelled and the slot gets reopened — travelling from the spec on disk to a cited MCP answer without anyone copying it
  - The whole build is three steps, none of them is "write documentation", and none of them needs a repository
cta:
  - "Fern: https://buildwithfern.com"
  - "Try the same flow on your own spec: npm i -g fern-api && fern init --openapi ./your-spec.yaml"
  - "Postman Discord: https://discord.gg/postman"
  - "The 25-minute version of this talk: ../../short-talks/mcp-docs-best-friend"
presentation_title: Make MCPs Your Documentation Best Friend
brand_style: manual
derived_from: mcp-docs-best-friend
notes: >
  This is the tools-in-action cut of the short talk. The short talk WALKS an already-published
  pipeline and spends its time on the argument; this one BUILDS the pipeline live and spends
  its time on the terminal. Same thesis, same payoff fact, opposite ratio.

  Deliberately dropped from the short talk, do not add them back: the cold open (the
  hand-built "before" portal under site/, Safari with JavaScript disabled, the 1,402-byte
  curl), the Postman desktop act, the three-service multi-API layout and its namespace war
  story, the GitHub Actions act, and the second Q&A prompt. All of them are good and none of
  them fit ten minutes at a booth.

  NO GIT, NO GITHUB, ON PURPOSE. An earlier draft of this cut opened with an empty GitHub
  repo as a prerequisite and pushed to it as a fourth step. That was removed: `fern init`,
  `fern check` and `fern generate --docs` need no repository whatsoever — setup.sh's preflight
  proves it every run by scaffolding in a mktemp folder that is not one. Carrying git bought
  an act, a second account to be logged into, a prerequisite that had to be reset between
  runs (GitHub has no "remove all commits", so resetting meant delete-and-recreate), and a
  `git push` that can fail on stage. All of it to gesture at CI, which one sentence in Act 3c
  and one Q&A answer now do just as well. If someone asks for the CI story, answer it; do not
  demo it.

  setup.sh opens the DECK AND NOTHING ELSE. The docs site does not exist until Act 3c
  publishes it, and buildwithfern.com is a slide rather than a demo surface. Extra tabs at a
  booth are how you lose the one you need.

  The deck is 6 slides, not the format's 5: title, then the three slides the presenter chose
  to keep from the short talk's twelve (two readers / the agent-facing surface / one spec to
  rule them all), then LIVE, then the CTA. The three content slides ARE "The Problem" and
  "The Journey" from templates/formats/lightning-talk.md, just split the way the source deck
  splits them. presentation/index.html reuses the short talk's CSS and navigation verbatim so
  the two decks stay visually identical.

  DO NOT RUN `fern check` IN ACT 3a. Verified against fern 5.114.1 on 2026-09-07: `fern init`
  scaffolds a TypeScript SDK generator group, and the SDK validator throws exactly 5 errors on
  this spec's request examples (`starts_at`, `duration_minutes`, `reason` on create and
  update). The cause is real and not fixable in the spec without diverging from the short
  talk's canonical copy: the request schemas are open (`additionalProperties`, because
  appointments-service stores a free-form JSONB `data` document), so the examples use keys
  Fern cannot see declared. Docs generation is unaffected. Act 3b rewrites generators.yml down
  to `api.specs` alone, which removes the SDK group, and `fern check` then prints "All checks
  passed". Any presence of the `groups:` block re-triggers it — removing only `default-group`
  is not enough. setup.sh reproduces this whole sequence in a throwaway folder on every run,
  so a CLI upgrade or a spec edit cannot break Act 3 silently.

  ONE SERVICE ONLY. The short talk publishes appointments + appointment-slots + prescriptions,
  which forces the multi-API layout (fern/apis/<name>/generators.yml) and an api-name in
  docs.yml. This demo publishes appointments alone, so it gets the single-API layout that
  `fern init --openapi` scaffolds: generators.yml directly under fern/, and `- api: API
  Reference` with NO api-name. Adding api-name to a single-API project fails the publish.

  THE PAYOFF FACT IS REAL AND IT IS ALREADY IN THE SPEC. openapi/appointments.openapi.yaml
  documents, both in info.description and on the PATCH operation, that a plain update emits
  `appointment.cancelled` and that appointment-slots-service therefore reopens the slot named
  by slot_id while the appointment is still active. Nothing was staged for this demo. Act 2
  shows that warning in the file on disk; Act 3e gets it back out of the MCP server with a
  citation. That round trip is the whole demo — if you cut anything, do not cut either end.

  VERIFIED END TO END ON 2026-09-07 against the published myhealthcare-booth site, not
  predicted: the ⚠️ warning arrives verbatim at line 19 of
  /api-reference/appointments/update.md; that page is 796,338 bytes as HTML and 9,189 as
  Markdown (~87x); a warm searchDocs call takes 5-15s; ACT 3e END TO END TAKES ~33s, prompt to
  finished answer, which is the number that matters on stage because it is silence to fill;
  Claude Code asks permission for mcp__<server-name>__searchDocs on the first call (approve
  it live, the prompt proves a tool call is leaving the machine); and the payoff prompt returns the
  PATCH endpoint, the slot-reopening side effect, and a citation to the update page. Say
  "nearly ninety times smaller", not "a hundred" — that is the short talk's three-service
  number, and this site is smaller. Re-measure if the spec or Fern changes.

  Single-API layout means single-API paths: /api-reference/appointments/update, NOT the short
  talk's /api-reference/healthcare-org/appointments-service/appointments/update. Take URLs
  from llms.txt rather than from either README.

  RUN THE AGENT IN AN EMPTY FOLDER. Act 3e runs in AGENTDIR (/tmp/appointments-agent), NOT in
  WORKDIR. This is the single most important structural fix in this cut, and it came out of the
  first live run on 2026-09-07: with the agent started in WORKDIR, where appointments.yaml sits,
  a slow search index made it answer "The docs site isn't indexed yet, but the local OpenAPI
  spec has the answer. Let me read the relevant sections." It then produced the CORRECT answer
  from the WRONG source — which is the worst outcome available, because it looks like the demo
  worked. The claim being demonstrated is that the fact travelled spec -> site -> MCP; an agent
  opening the file next to it demonstrates none of that. With an empty folder there is no
  escape hatch: a slow index makes the agent wait, retry, or say it cannot answer, all of which
  are honest and recoverable at a booth. setup.sh creates AGENTDIR and asserts it is empty.

  THE ACT 3e PROMPT MUST NOT NAME THE MCP SERVER. Observed 2026-09-08: the agent opened with
  "no server named appointments-docs is connected; the only docs server available is
  booth-demo-docs-buildwithfern-com". One server, at least three names in circulation —
  `appointments-docs` (this demo's command), `booth-demo-docs-buildwithfern-com` (the docs
  site's own UI snippet, which is what a presenter reaches for after Act 3d), and
  `fern_mcp_booth-demo-docs-buildwithfern-com` (the usage.claudeCode field of /_mcp/server).
  The prompt therefore says "the connected docs MCP server — the only MCP server in this
  folder". Do not reintroduce a name. For the same reason setup.sh and teardown.sh detect
  registrations by URL, never by name.

  MCP REGISTRATIONS ARE DIRECTORY-SCOPED. `claude mcp add` defaults to --scope local, keyed to
  the cwd and stored in ~/.claude.json rather than in the folder. So teardown.sh MUST
  unregister from inside the folder BEFORE deleting it — reverse that order and the entry is
  orphaned, setup.sh recreates the path, the stale entry returns with it, and Act 3e opens with
  `claude mcp add` erroring on a duplicate name in front of the audience.

  Worse, local scope is INHERITED BY SUBDIRECTORIES. A registration made in /private/tmp is
  visible from every /tmp/* folder, AGENTDIR included, so it silently makes "a genuine
  first-time connect" false forever. Found exactly that on 2026-09-08. Both scripts therefore
  search $AGENTDIR, $WORKDIR and /private/tmp, and match on the MCP URL so they catch the
  registration whatever name it was given.

  THE INDEX IS THE FRAGILE PART, and it is slower than first assumed. Measured on the first
  live run, 2026-09-07: searchDocs was still unavailable when `fern generate --docs` had just
  finished, and answering normally about FIVE MINUTES later (in 13s). A warm site answers in
  5-15s. A ten-minute demo has no five minutes of slack, so the site must already exist before
  you present: run the full demo once when you get to the booth, then run teardown and present
  again. On stage `fern generate --docs` republishes to a subdomain that already has an index,
  which is both faster and much safer. setup.sh tells you which case you are in and refuses to
  pretend. If the index is cold anyway, fall back to the short talk's site
  (myhealthcare.docs.buildwithfern.com) — same spec, same warning, permanently warm. That is a
  READ-ONLY use: claude mcp add against its MCP server and curl on its llms.txt. It is the
  real production documentation and must never appear in this demo's docs.yml.

  THE ORGANIZATION IS NOT THE SUBDOMAIN, and conflating them cost a demo on 2026-09-07.
  FERN_ORG (default `postman-devrel`) is the DevRel team's shared, permanent Fern tenant; it
  goes in fern.config.json. FERN_HANDLE (default `booth-demo`) is the per-demo site inside it;
  it goes in docs.yml. They are independent — `postman-devrel` also publishes
  myhealthcare.docs.buildwithfern.com, which is the proof.

  An earlier draft of this cut passed FERN_HANDLE to `fern init --organization`. That does not
  fail: Fern silently provisions an organization under whatever name you invent, on first
  publish. The mistake only surfaced when the presenter deleted that organization to "reset"
  the demo — after which the account belonged to no organization at all and every publish died
  with a 500 "Failed to resolve organization", with nothing in the message pointing at the
  cause. `fern org get` is the diagnostic: "No org-level CLI config set for X" means X resolves,
  403 means no access — and it 403s on ANY name when you belong to nothing, so a 403 does not
  mean "name taken". setup.sh now runs that check before you walk on.

  NEVER DELETE A FERN ORGANIZATION to reset this demo. There is nothing up there to reset. The
  org is permanent, the site lives inside it, and republishing over the same subdomain IS the
  reset. Note that deleting the org does NOT take the published site down — the orphaned
  myhealthcare-booth site was still serving HTTP 200 afterwards, which makes the failure even
  more confusing than it needs to be.

  FERN_HANDLE must NOT be `myhealthcare`. That subdomain is the REAL MyHealthcare
  documentation, living in the same organization as this demo, which is exactly what makes it
  easy to clobber — `fern generate --docs` publishes wherever docs.yml points. setup.sh
  hard-fails on that exact string, but read docs.yml before every publish anyway.
  WORKDIR (default /tmp/appointments-docs) is configurable too, so two people can run this at
  the same booth.

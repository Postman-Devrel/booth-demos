format: lightning-talk
length: 10m
owner: Anthony Viard <anthony.viard@postman.com>
status: draft
audience: >
  Developers and platform engineers who own an API other teams consume, and who
  run tests in CI. No Postman account needed to follow along; a Context
  Graph-enabled team is needed to present.
venues:
  - booth
  - meetup
  - conference
product: Postman CLI
name: The Check Your CI Is Missing — the Postman CLI as a Blast-Radius Gate
use_case: >
  Show that a pipeline can only fail on what it can see, and that the Postman CLI
  is what lets it see past the repository — one binary that runs a blast-radius
  check in CI, in your terminal, and in your coding agent's shell, so the agent
  can find out who a change breaks and fix it before the merge.
primary_api:
  - postman context-graph ask — the CLI command the gate and the agent both run
  - The gate itself — app/ci/blast-radius-check.sh (our policy, ~150 lines of shell, on top of the CLI)
  - The pipeline — app/.github/workflows/blast-radius.yml
  - API Context Graph — https://www.postman.com/context-graph/
  - Postman CLI — https://www.postman.com/product/postman-cli/
  - Bundled provider repo in ./app (orders-api — the only repo on the machine)
  - Demo estate in ./estate (three consumer repos, published to GitHub once — see estate/README.md)
key_messages:
  - CI can only fail on what it can see. Your test suite checks this service against itself; nothing in the pipeline checks it against the people who call it.
  - >-
    Three roles, one chain: the agent orchestrates and fixes, the Postman CLI is
    the connector, the Context Graph is the awareness that does not fit in a repo.
  - The CLI is what makes the graph a gate. One binary with the same exit-code contract in your terminal, in your agent's shell, and in your pipeline — no SDK, no MCP server to stand up, no separate test infrastructure.
  - Pipeline-aware exit codes are the whole trick — 0 pass, 1 blocked, 2 could-not-prove-it. A check that cannot answer must not silently pass.
  - >-
    The gate is policy you own, not a product feature. The CLI hands you the
    answer and an exit code; deciding what blocks a merge is about a hundred
    lines of shell in your own repo.
  - Endpoint blast radius is not field blast radius — three services call the endpoint, two read the field. That distinction is what turns a scary answer into an actionable one.
  - The agent does not just report, it corrects — it runs the same CLI the pipeline runs, learns who it was about to break, puts the field back on a sunset timeline, and turns the gate green.
cta:
  - "npm install -g postman-cli@latest, then: postman context-graph ask \"what depends on <your-api>?\" --wait"
  - "Postman CLI: https://www.postman.com/product/postman-cli/"
  - "API Context Graph: https://www.postman.com/context-graph/"
  - "The launch post, with the benchmark: https://blog.postman.com/introducing-the-context-graph-api-one-map-of-your-api-ecosystem/"
  - "Grab the demo, gate included: git clone https://github.com/Postman-Devrel/booth-demos.git (content/lightning-talks/postman-cli-blast-radius-gate)"
presentation_title: The Check Your CI Is Missing
brand_style: design-sync
notes: >
  THE GATE IS OURS, NOT A CLI FEATURE. SAY SO ON STAGE. `postman context-graph ask`
  is a Postman command; app/ci/blast-radius-check.sh is about a hundred and fifty
  lines of shell that this repo wrote on top of it. Never imply Postman ships a
  blast-radius gate. The honest and much better framing is the one in Act 2: the
  CLI gives you the answer and a pipeline-aware exit code, and the policy — what
  blocks a merge — is yours and is small. Attendees who think it is a product
  feature will go looking for it and not find it.

  THE NUMBERS ARE QUOTED, NOT MEASURED. Nothing here benchmarks anything on stage.
  Slide 5 and Act 4 carry Postman's own published figures and must be attributed
  every time: the product page (https://www.postman.com/context-graph/) reports 29%
  fewer prompt tokens and 17% fewer tool calls per run; the launch post reports,
  over 468 repositories and three frontier models on eight cross-service questions,
  up to 74% fewer prompt tokens, 52% fewer tool calls, 72% lower cost, and accuracy
  gains on 18 of 21 prompt-model pairs. Lead with the product-page figures and use
  the launch-post ones as the ceiling, explicitly as "up to". Never round up.

  CONTEXT GRAPH IS TEAM-GATED AND INGESTS NIGHTLY. It is not a free-tier feature and
  you cannot provision it in the hallway. The estate has to be seeded and ingested at
  least a day ahead — estate/README.md is the whole procedure. With no graph access,
  run the gate with BLAST_RADIUS_ANSWER_FILE pointing at .demo-state/ask.txt and say
  out loud that the answer was captured earlier. Do not narrate a live call that did
  not happen.

  THE GATE PARSES A "SERVICES:" LINE, AND THAT IS DELIBERATE. The question the gate
  asks ends by requesting a machine-readable tail, because a gate needs something to
  branch on. Scraping service names out of the prose was tried and picked up team
  handles and file names — it reported nine services where there are three, which
  would have been humiliating on stage. If the graph stops producing the line, the
  gate exits 2 and refuses to guess; setup.sh warns you when the line is absent.

  THE CLI CHECK IS A CAPABILITY PROBE, NOT A VERSION COMPARISON. Older Postman CLIs
  (1.43.0, for one) answer `postman context-graph ask ...` with "Invalid command" and
  still exit 0 — a naive `command -v` or exit-code check passes and the demo dies on
  stage. setup.sh and the gate both grep the root help for `context-graph` instead.
  Known-good CLI at the time of writing: 1.62.0. Do not "simplify" that probe.

  THE TEST SUITE MUST BE GREEN AFTER THE BREAKING CHANGE. That is the hook, not a bug:
  app/test/ asserts the fields orders-api promises in its own spec and deliberately
  does not assert legacy_customer_ref, because nobody writes a test for a field their
  own service never reads. setup.sh fails loudly if the suite goes red, because a red
  suite is a different talk.

  ACT 1 ONLY WORKS BECAUSE app/ IS THE ONLY REPO ON THE MACHINE. The consumer repos
  live in estate/ for seeding and are never opened or greppable from the agent's
  working directory. If you cd the agent up to the content folder it can grep
  estate/repos/ and the premise collapses. Stay in ./app. setup.sh warns if any
  outbound fetch() appears under app/, which is the signature of a leak.

  SAME PRODUCT AS open-meteo-loop-eng, DIFFERENT SIGNAL AND DIFFERENT SCOPE. Both talks
  end on a red-to-green loop driven by the Postman CLI, so do not give them back to back
  without saying how they differ: that one's oracle is a collection's assertions about
  one API response, this one's is the estate's dependency graph about everyone else's
  code. If a booth crowd has seen both, lead with that sentence. No derived_from —
  neither is a cut of the other.

  THE DEMO DOES NOT SHIP THE REMOVAL. The agent's fix is to put the field back on a
  sunset timeline, which is why the gate goes green through the "no fields removed"
  path. The gate's second green path — ship the removal with a complete IMPACT.md —
  exists and is worth one sentence in Act 3, but do not demo it. Resist adding the
  deletion for drama; the close depends on the change not being shipped.
